<!--
  Demo 1 —— HTML + Tailwind 一次成页（可直接用离线引擎验证）

  这条 demo 证明的是**引擎那一段**：HTML+Tailwind → 真浏览器实测像素 → DSL。
  它**不需要宿主**，所以任何人都能复现（见 examples/README.md）：

      cd plugin-penpot
      yarn harness:build && node scripts/serve.mjs --root harness-dist --port 4406 &
      CHROME_FLAGS=--no-sandbox node scripts/harness-render.mjs ../examples/01-html-to-canvas.html

  刻意覆盖了真机上翻过车的几类写法：
    - flex 容器 + 显式子元素宽度（不声明宽度会被 Hug 聚拢成一团）
    - 渐变 / 阴影 / 圆角（多层填充与效果）
    - `data-icon` 图标（Iconify SVG → 原生可编辑 Path）
    - badge/chip 这类圆角小标签必须自带 flex，否则盒模型会走样
    - 每个元素都有 `data-name`（图层命名契约；覆写与换组件都按图层名查找）

  字体：显式指定 `Noto Sans TC`。Penpot 的字体表是 Google Fonts 镜像，没有 PingFang /
  微软雅黑 / Inter，写不存在的族或不写都会**静默退回宿主默认字体**（详见 docs/host-differences.md）。

  注意：`data-table` / `<chart>` / `<component>` 需要**服务端预处理**，客户端引擎不展开它们，
  所以这条 demo 只用客户端可解析的部分。要看服务端那条链，走 `code_to_design`（需要宿主）。
-->
