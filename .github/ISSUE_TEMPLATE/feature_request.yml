name: Feature request
description: 新能力、新宿主适配、文档改进
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        加**新宿主**的请求请直接看 `docs/adapter-spec.md`（P3.2 产出，若尚未合入请先看
        `plugin-penpot/` 作为第二个宿主的完整范例）—— 那类改动主仓只收适配器，不收核心分支。

  - type: dropdown
    id: kind
    attributes:
      label: 类型
      options:
        - 新宿主适配
        - 新工具 / 新 DSL 能力
        - 渲染保真度（HTML/Tailwind → 画布 的映射缺口）
        - 设计系统 / 令牌
        - 文档 / 示例 / 翻译
        - 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 你要解决的问题
      description: 先说场景和痛点，再说你设想的方案 —— 这样我们能一起找更小的切口。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你设想的方案（可选）
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 你试过的替代做法（可选）
      description: 比如用现有工具组合、手写 DSL、导出后用别的工具加工
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 issue / roadmap，没有重复
          required: true
