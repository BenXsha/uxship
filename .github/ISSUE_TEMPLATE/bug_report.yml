# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-issue-forms.json
name: Bug report
description: 渲染结果不对、工具报错、插件连不上 —— 请按模板给足复现材料
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。这是一个**本地优先**的项目：插件、服务端、画布都在你机器上，
        所以绝大多数问题都能从日志里定位 —— 请尽量把下面的信息填全。

        ⚠️ 提交前请**移除令牌、私有文档链接和设计稿截图里的敏感内容**。

  - type: dropdown
    id: host
    attributes:
      label: 宿主（画布）
      description: 问题出在哪一侧？
      options:
        - MasterGo
        - Penpot
        - 两侧都有
        - 与服务端/CLI 有关，与宿主无关
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本
      description: 插件「关于」弹层或服务端 `/health` 里显示的版本；四个包版本应当一致
      placeholder: '3.0.0'
    validations:
      required: true

  - type: dropdown
    id: layer
    attributes:
      label: 你觉得问题在哪一层
      description: 不确定就选「不知道」—— 我们会帮你缩小范围
      options:
        - 不知道
        - 服务端预处理（图标 / 图表 / 组件展开）
        - 客户端渲染（HTML+Tailwind → DSL）
        - 画布写入（DSL → 宿主节点）
        - 连接 / 会话（插件连不上、多文档串台）
        - 反方向：画布 → 代码（DSL 导出 / 生成 HTML）
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 现象
      description: 期望什么、实际什么。有截图请贴上来。
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 最小复现
      description: |
        最有用的是**最小 HTML/Tailwind 片段**或具体工具调用参数。
        如果只发生在某个设计稿上，请用 `dsl_export_node` 导出一段能复现的最小结构。
      render: html
      placeholder: |
        <section class="flex flex-col p-[24px]" data-name="repro">
          ...
        </section>
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: |
        插件底部日志面板的内容（含 `unresolvedClasses` / skipped 降级项最关键）。
        服务端相关请附启动输出。**贴之前删掉 token。**
      render: shell
    validations:
      required: false

  - type: textarea
    id: env
    attributes:
      label: 环境
      description: 操作系统、Node 版本、宿主客户端版本（MasterGo 桌面端 / Penpot 版本）、是否私有化企业版
      placeholder: 'macOS 15 / Node 24.13.1 / MasterGo 桌面端 1.10.3'
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 issue，没有重复
          required: true
        - label: 我已移除日志/截图中的令牌与敏感信息
          required: true
